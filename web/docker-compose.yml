version: '3'
services:

  php-apache:
    image: webdevops/php-apache:8.1-alpine
    container_name: test-site
    ports:
    - 8000:80
    volumes:
    - ./:/var/www/html
    environment:
      WEB_DOCUMENT_ROOT: /var/www/html/public

  mysql:
    image: mysql:8.0
    container_name: test-site-mysql80
    volumes:
    - mysql80:/var/lib/mysql
    environment:
      MYSQL_TCP_PORT: 3308
      MYSQL_ROOT_PASSWORD: torapants

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: test-site-phpMyAdmin80
    links:
      - mysql
    ports:
    - 8001:80
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3308
      UPLOAD_LIMIT: 2000M

volumes:
  mysql80: