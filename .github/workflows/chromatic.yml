name: "Chromatic"

on:
  push:
    branches:
      - master
    paths:
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/chromatic.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/chromatic.yml"

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'visual-check'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v3.5.1
        with:
          version: 2025.12.12
          cache: true
          install: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.6
        with:
          enable-cache: true

      - name: Install tools with mise
        run: mise install

      - name: Get pnpm cache directory
        id: pnpm-cache-dir
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBaseDir: web
          onlyChanged: true
          untraced: "package.json,pnpm-lock.yaml,**/package.json,**/pnpm-lock.yaml" # Do not retake for package updates
          skip: "dependabot/**"
          exitOnceUploaded: true
