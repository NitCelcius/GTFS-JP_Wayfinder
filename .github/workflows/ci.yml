name: CI

on:
  pull_request:
    branches: ["*"]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  turbo-checks:
    runs-on: ubuntu-latest
    # Skip branches starting with "wip"
    if: "!startsWith(github.head_ref, 'wip')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          version: 2025.9.16

      - name: Bootstrap repository dependencies
        run: |
          # Install all tools defined in mise.toml
          mise install
          # Install pnpm dependencies (this bootstraps the monorepo)
          pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Run lint
        run: pnpm run prepush

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
